<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>PC Remote</title>
    <link rel="stylesheet" href="style.css?v=4">
</head>

<body>
    <div class="container">

        <div class="header">
            <h1>PC Remote</h1>
            <div id="statusBadge" class="status-badge">
                <div class="dot"></div><span id="statusText">Offline</span>
            </div>
        </div>

        <!-- MEDIA (Now Playing + Global + Web) -->
        <details class="card-dropdown" open>
            <summary>MEDIA</summary>

            <!-- Now Playing Area -->
            <div id="nowPlayingCard">
                <div id="npEmpty"
                    style="display: flex; justify-content: center; align-items: center; height: 64px; color: var(--secondary); font-weight: 600; font-size: 15px;">
                    Nothing there...
                </div>
                <div class="np-row" id="npContent" style="display: none;">
                    <div class="np-art" id="npArt">🎵</div>
                    <div class="np-meta">
                        <div class="np-title" id="npTitle">Unknown</div>
                        <div class="np-artist" id="npArtist"></div>
                        <div class="np-status" id="npStatus"></div>
                    </div>
                </div>
                <hr class="card-divider">
            </div>

            <!-- Player Controls -->
            <div class="media-grid">
                <button type="button" id="btnMediaPrev">⏮</button>
                <button type="button" id="btnWebLeft">−15s</button>
                <button type="button" class="play-btn" id="btnMediaPlay">⏯</button>
                <button type="button" id="btnWebRight">+15s</button>
                <button type="button" id="btnMediaNext">⏭</button>
            </div>
        </details>

        <!-- AUDIO & DISPLAY -->
        <details class="card-dropdown" open>
            <summary id="audioDisplayTabs">
                <div style="display: flex; gap: 8px; align-items: center;">
                    <span id="tabAudio"
                        style="text-decoration: underline; cursor: pointer; text-underline-offset: 4px; padding: 4px 8px; margin-left: -8px;">AUDIO</span>
                    <span style="opacity: 0.4; font-weight: 300;">/</span>
                    <span id="tabDisplay"
                        style="cursor: pointer; opacity: 0.6; text-underline-offset: 4px; padding: 4px 8px;">DISPLAY</span>
                </div>
            </summary>

            <div id="tabContentContainer">
                <!-- AUDIO CONTENT -->
                <div id="contentAudio">
                    <!-- Master Volume -->
                    <div class="master-vol-row">
                        <input id="slider" type="range" min="0" max="100" value="50">
                        <div class="volume-number" id="volumeDisplay">--%</div>
                    </div>

                    <hr class="card-divider">

                    <!-- Output Device -->
                    <details class="dropdown-details">
                        <summary>Output Device</summary>
                        <div id="deviceList" class="device-list">
                            <div class="hint">…</div>
                        </div>
                    </details>

                    <!-- Volume Mixer -->
                    <details class="dropdown-details" style="margin-bottom: 0;">
                        <summary>Volume Mixer</summary>
                        <div id="sessionList" class="session-list">
                            <div class="hint">No active apps</div>
                        </div>
                    </details>
                </div>

                <!-- DISPLAY CONTENT -->
                <div id="contentDisplay" style="display: none;">
                    <div class="master-vol-row" id="brightnessContainer">
                        <input id="brightnessSlider" type="range" min="0" max="100" value="50">
                        <div class="volume-number" id="brightnessDisplay" style="white-space: nowrap;">--%</div>
                    </div>

                    <hr class="card-divider" id="brightnessDivider">

                    <details class="dropdown-details" style="margin-bottom: 12px; margin-top: 8px;">
                        <summary>Monitors</summary>
                        <div id="displayList" class="device-list">
                            <div class="hint">…</div>
                        </div>
                    </details>

                    <details class="dropdown-details" style="margin-bottom: 12px;">
                        <summary>Main Monitor</summary>
                        <select id="primaryMonitorSelect"
                            style="width: 100%; padding: 12px; background: var(--surface3); color: var(--text); border: none; border-radius: 8px; font-size: 15px; outline: none; -webkit-appearance: none; appearance: none; text-align: center; font-weight: 500; cursor: pointer;"></select>
                    </details>
                    <details class="dropdown-details" style="margin-bottom: 0;">
                        <summary>Mode</summary>
                        <select id="projectionModeSelect"
                            style="width: 100%; padding: 12px; background: var(--surface3); color: var(--text); border: none; border-radius: 8px; font-size: 15px; outline: none; -webkit-appearance: none; appearance: none; text-align: center; font-weight: 500; cursor: pointer;">
                            <option value="extend" selected>Extend</option>
                            <option value="clone">Clone</option>
                        </select>
                    </details>
                </div>
            </div>
        </details>

        <!-- CONTROLS -->
        <details class="card-dropdown">
            <summary>CONTROLS</summary>

            <div id="touchpad" class="touchpad-area">
                <span class="touchpad-text">TOUCHPAD</span>
            </div>

            <div class="sensitivity-control">
                <label for="sensSlider"><span>Sensitivity</span> <span id="sensValue">5.0x</span></label>
                <input id="sensSlider" type="range" min="0" max="10" step="0.1" value="5.0">
            </div>

            <div class="mouse-buttons">
                <button type="button" id="btnLeftClick">Left Click</button>
                <button type="button" id="btnRightClick">Right Click</button>
            </div>

            <button type="button" id="btnKeyboard" class="btn-keyboard">Keyboard</button>

            <input type="text" id="hiddenKeyboard" inputmode="text" autocomplete="off" autocorrect="off"
                spellcheck="false" style="position:fixed; left:-9999px; top:0; opacity:0; height:1px; width:1px;">
        </details>

        <!-- POWER -->
        <details id="powerDetails" class="card-dropdown">
            <summary class="power-summary" style="display: block;">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <span>POWER</span>
                    <span id="timerBadge"
                        style="display: none; font-size: 12px; font-weight: 600; color: var(--accent); flex: 1; text-align: center; padding: 0 8px;"></span>
                    <span class="power-arrow">▼</span>
                </div>
            </summary>
            <div class="timer-row">
                <div class="timer-col"><label>Hours</label><input type="number" id="timeHours" min="0" value="0"></div>
                <div class="timer-col"><label>Minutes</label><input type="number" id="timeMins" min="0" max="59"
                        value="0"></div>
                <div class="timer-col"><label>Seconds</label><input type="number" id="timeSecs" min="0" max="59"
                        value="0"></div>
            </div>

            <div class="power-grid">
                <button type="button" class="btn-primary" onclick="sendPowerCommand('shutdown')"><span
                        class="power-icon">🔌</span> Shutdown</button>
                <button type="button" onclick="sendPowerCommand('restart')"><span class="power-icon">↻</span>
                    Restart</button>
                <button type="button" onclick="sendPowerCommand('sleep')"><span class="power-icon">🌙</span>
                    Sleep</button>
                <button type="button" onclick="sendPowerCommand('hibernate')"><span class="power-icon">💾</span>
                    Hibernate</button>
                <button type="button" class="btn-cancel" onclick="sendPowerCommand('cancel')">Cancel</button>
            </div>
        </details>

    </div>

    <script src="app.js?v=22"></script>
</body>

</html>
